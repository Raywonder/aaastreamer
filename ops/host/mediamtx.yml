logLevel: info
logDestinations: [stdout]

authMethod: http
authHTTPAddress: http://127.0.0.1:8095/api/mediamtx/auth
authHTTPExclude:
  - action: read
  - action: playback
  - action: api
  - action: metrics
  - action: pprof

api: false

playback: false
metrics: false
pprof: false


rtsp: false
rtmp: true
rtmpAddress: :1935
hls: true
hlsAddress: :8096
hlsAllowOrigins: ['*']
hlsAlwaysRemux: true
hlsVariant: mpegts
hlsSegmentCount: 12
hlsSegmentDuration: 2s
hlsPartDuration: 500ms
hlsSegmentMaxSize: 50M
hlsMuxerCloseAfter: 120s

webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts: []
srt: false
moq: false

paths:
  all:
    source: publisher
    runOnReady: /opt/aaastreamer/hooks/on-ready.sh
    runOnReadyRestart: false
    runOnNotReady: /opt/aaastreamer/hooks/on-not-ready.sh
